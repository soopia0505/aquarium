<!DOCTYPE html> <html lang="ko"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"> <title>수중 터널 — 물고기 미디어아트</title> <style> :root{ --bg:#0b0e12; --panel:#12161c; --panel-line:#232a33; --ink:#eef1ee; --ink-dim:#9aa5ad; --paper:#fbf6ec; --accent:#7fd4c1; } *{box-sizing:border-box;} html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font-family:"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif; } #scene{ position:absolute; inset:0; display:block; touch-action:none; } /* ---------- top bar ---------- */ .topbar{ position:absolute; top:0; left:0; right:0; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; z-index:10; pointer-events:none; } .topbar > *{ pointer-events:auto; } .brand{ font-size:13px; letter-spacing:.08em; color:var(--ink-dim); text-transform:uppercase; font-weight:600; display:flex; align-items:center; gap:8px; } .brand .dot{ width:6px;height:6px;border-radius:50%; background:var(--accent); box-shadow:0 0 8px var(--accent); } .tabs{ display:flex; gap:4px; background:rgba(18,22,28,.72); border:1px solid var(--panel-line); border-radius:999px; padding:4px; backdrop-filter:blur(6px); max-width:100%; overflow-x:auto; } .tabs button{ appearance:none; border:none; background:transparent; color:var(--ink-dim); font-size:13px; font-weight:600; padding:8px 14px; border-radius:999px; cursor:pointer; transition:color .2s, background .2s; font-family:inherit; white-space:nowrap; } .tabs button.active{ background:var(--tab-accent,#2a3138); color:var(--ink); } .tabs button:hover{ color:var(--ink); } .actions{ display:flex; flex-wrap:wrap; align-items:center; justify-content:flex-end; gap:10px; } .pill-info{ font-size:12px; color:var(--ink-dim); background:rgba(18,22,28,.72); border:1px solid var(--panel-line); padding:8px 12px; border-radius:999px; backdrop-filter:blur(6px); font-variant-numeric:tabular-nums; } .pill-info.sizectl{ display:flex; align-items:center; gap:7px; } .sizectl input[type="range"]{ width:70px; vertical-align:middle; accent-color:var(--accent); } .sizectl .label-short{ display:none; } .fishpicker-wrap{ position:relative; } .fishcount-btn{ font-family:inherit; cursor:pointer; appearance:none; } .fishcount-btn:hover{ color:var(--ink); } .fish-dropdown{ display:none; position:absolute; top:calc(100% + 8px); left:0; min-width:230px; max-height:300px; overflow-y:auto; background:rgba(18,22,28,.7); backdrop-filter:blur(10px); border:1px solid var(--panel-line); border-radius:14px; padding:8px; box-shadow:0 16px 36px rgba(0,0,0,.45); z-index:30; } .fish-dropdown.open{ display:block; } .fish-dropdown .empty{ font-size:12px; color:var(--ink-dim); padding:14px 8px; text-align:center; } .fish-row{ display:flex; align-items:center; gap:9px; padding:6px 5px; border-radius:9px; } .fish-row:hover{ background:rgba(255,255,255,.06); } .fish-row img{ width:30px; height:30px; object-fit:contain; border-radius:6px; background:rgba(255,255,255,.08); flex:0 0 auto; } .fish-row input[type="range"]{ flex:1; min-width:0; accent-color:var(--accent); } .fish-row .pct{ font-size:11px; color:var(--ink-dim); width:36px; text-align:right; font-variant-numeric:tabular-nums; flex:0 0 auto; } .btn{ appearance:none; border:1px solid var(--panel-line); cursor:pointer; font-family:inherit; font-weight:700; font-size:13px; border-radius:999px; padding:9px 16px; transition:transform .15s, filter .15s; } .btn:hover{ filter:brightness(1.08); } .btn:active{ transform:scale(.96); } .btn:disabled{ opacity:.35; cursor:not-allowed; filter:none; transform:none; } .btn-primary{ background:var(--accent); color:#0b0e12; border-color:transparent; } .btn-ghost{ background:rgba(18,22,28,.72); color:var(--ink-dim); backdrop-filter:blur(6px); } .btn-ghost:hover{ color:var(--ink); } .undo-row{ display:flex; gap:8px; margin-top:12px; } .caption{ position:absolute; left:0; right:0; bottom:16px; text-align:center; font-size:12px; color:var(--ink-dim); letter-spacing:.02em; pointer-events:none; z-index:5; } /* ---------- draw panel: docked to one side, aquarium stays visible ---------- */ .modal-backdrop{ position:absolute; inset:0; background:rgba(4,6,9,.32); z-index:50; opacity:0; pointer-events:none; transition:opacity .25s ease; } .modal-backdrop.open{ opacity:1; pointer-events:auto; } .modal{ position:absolute; top:0; right:0; bottom:0; width:min(430px,94vw); background:var(--panel); border-left:1px solid var(--panel-line); padding:20px; overflow:auto; box-shadow:-28px 0 60px rgba(0,0,0,.45); transform:translateX(100%); transition:transform .3s ease; } .modal-backdrop.open .modal{ transform:translateX(0); } .modal h2{ margin:0 0 2px; font-size:17px; } .modal .sub{ margin:0 0 14px; font-size:12.5px; color:var(--ink-dim); } .canvas-wrap{ background: repeating-linear-gradient(45deg, #efe7d4 0 10px, #f6efe0 10px 20px); border-radius:14px; padding:14px; display:flex; justify-content:center; border:1px solid #d8cdb2; } #drawCanvas{ background:var(--paper); border-radius:8px; max-width:100%; height:auto; box-shadow:0 2px 10px rgba(0,0,0,.25) inset; cursor:crosshair; touch-action:none; } .tool-row{ display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; align-items:center; } .modebtns{ display:flex; gap:6px; background:#1a2027; border:1px solid var(--panel-line); border-radius:10px; padding:3px; } .modebtns button{ appearance:none; border:none; background:transparent; color:var(--ink-dim); font-family:inherit; font-size:12.5px; font-weight:700; padding:7px 12px; border-radius:8px; cursor:pointer; } .modebtns button.active{ background:#2a3138; color:var(--ink); } .swatches{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; } .swatch{ width:26px; height:26px; border-radius:50%; border:2px solid rgba(255,255,255,.15); cursor:pointer; padding:0; position:relative; } .swatch.selected{ border-color:var(--accent); box-shadow:0 0 0 2px rgba(127,212,193,.35); } .colorpick{ width:26px; height:26px; border-radius:50%; overflow:hidden; border:2px solid rgba(255,255,255,.15); padding:0; cursor:pointer; background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red); } .colorpick input{ opacity:0; width:1px; height:1px; position:absolute; } .brushsize{ display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-dim); } .brushsize input{ width:90px; } .modal-footer{ display:flex; justify-content:space-between; gap:10px; margin-top:16px; } .modal-footer .left{ display:flex; gap:8px; } @media (max-width:700px){ .brand{ display:none; } .topbar{ justify-content:center; } .actions{ justify-content:center; } .tool-row{ justify-content:center; } } @media (max-width:480px){ .sizectl .label-full{ display:none; } .sizectl .label-short{ display:inline; } .sizectl input[type="range"]{ width:56px; } .pill-info{ padding:7px 10px; font-size:11px; } .btn{ padding:8px 12px; font-size:12px; } } </style> </head> <body> <canvas id="scene"></canvas> <div class="topbar"> <div class="brand"><span class="dot"></span>수중 터널</div> <div class="tabs" id="themeTabs"></div> <div class="actions"> <div class="fishpicker-wrap" id="fishPickerWrap"> <button class="pill-info fishcount-btn" id="fishCount">물고기 0마리</button> <div class="fish-dropdown" id="fishDropdown"></div> </div> <div class="pill-info sizectl" title="터널 속 물고기 전체 크기"> 🐟 <span class="label-full">모든 물고기 크기 조정</span><span class="label-short">크기</span> <input type="range" id="fishScale" min="40" max="160" value="70"> </div> <button class="btn btn-ghost" id="resetBtn">비우기</button> <button class="btn btn-primary" id="openDraw">+ 그림판 열기</button> </div> </div> <div class="caption">그림판을 열어 자유롭게 그리면 터널 속을 헤엄쳐요<br>물고기마다 헤엄치는 속도가 저마다 달라요</div> <div class="modal-backdrop" id="modalBackdrop"> <div class="modal"> <h2>자유롭게 그리기</h2> <p class="sub">마음대로 그려서 나만의 생물을 만들어보세요.</p> <div class="canvas-wrap"> <canvas id="drawCanvas" width="480" height="300"></canvas> </div> <div class="undo-row"> <button class="btn btn-ghost" id="undoBtn" disabled>↩ 뒤로가기</button> <button class="btn btn-ghost" id="redoBtn" disabled>↪ 앞으로가기</button> </div> <div class="tool-row"> <div class="modebtns" id="toolBtns"> <button data-tool="pen" class="active">🖊 펜</button> <button data-tool="eraser">🧹 지우개
